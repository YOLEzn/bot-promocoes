name: Executar Bot de Promocoes

on:
  schedule:
    # Roda a cada 1 hora automaticamente
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar Script
        run: python automacao_nuvem.py
